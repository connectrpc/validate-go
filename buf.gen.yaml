version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: connectrpc.com/validate/internal/gen
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/gen
    opt: paths=source_relative
  # connect-go v1 stubs for testing the v1 Interceptor. The binary is built from
  # connectrpc.com/connect/cmd/protoc-gen-connect-go; see the Makefile.
  - local: protoc-gen-connect-go-v1
    out: internal/gen/connectv1
    opt: paths=source_relative
